name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The MySQL suite skips itself when `DSH_DBGRAPH_TEST_MYSQL_DSN` is unset, and the coverage gate
    # is perFile 100%: a skipped suite leaves catalog/src/mysql.ts near 14% and fails the build. A
    # throwaway server keeps the gate honest instead of lowering it for CI.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: dbgraph_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DSH_DBGRAPH_TEST_MYSQL_DSN: mysql://root@127.0.0.1:3306/dbgraph_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One version has to agree across every published package, the lockfile's
      # pins and the minimumReleaseAgeExclude list. This gate fails here, before
      # anything is published, rather than mid-release.
      - name: Release version gate
        run: pnpm run check:versions

      # `tsc -b` is the only static gate: strict, noUnusedLocals/Parameters.
      # It also builds `lib/`, which the tests import through the paths facade.
      - name: Typecheck
        run: pnpm run typecheck

      # The coverage thresholds are perFile 100%, so a new branch without a test
      # is a CI failure rather than a slow drift.
      - name: Test
        run: pnpm run test:coverage
