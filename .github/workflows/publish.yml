name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # No native build job here on purpose: this plugin's Rust kernel is an optional accelerator
  # (`artifacts/` is gitignored, and the store falls back to the JavaScript writer when no addon
  # loads), so a release is only the five JS packages. Adding a platform-addon matrix later means
  # adding a `build-native` job and naming its packages as optionalDependencies — until then there is
  # nothing to build, and a job that produces nothing is a job that can only fail.
  publish:
    runs-on: ubuntu-latest
    # The MySQL suite skips itself when `DSH_DBGRAPH_TEST_MYSQL_DSN` is unset, and the coverage gate
    # is perFile 100%: a skipped suite leaves catalog/src/mysql.ts near 14% and fails the build.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: dbgraph_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DSH_DBGRAPH_TEST_MYSQL_DSN: mysql://root@127.0.0.1:3306/dbgraph_test
    permissions:
      # Required for npm provenance: mints the OIDC token that lets npm attest this tarball was built
      # from this repo at this commit. Without it the publish still succeeds, but silently drops the
      # provenance badge.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # `node:sqlite` is a Node 22 API and the store depends on it, so the runtime here has to
          # match what this package declares in `engines`.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Publishing an artifact that does not typecheck or pass its own tests is not recoverable: npm
      # forbids re-using a version number.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # The bundle is what users install, so its npm page must render the project README. Copied at
      # publish time rather than committed, so the two can never drift apart.
      - name: Stage bundle README
        run: cp README.md packages/bundle/README.md

      # `pnpm -r publish` walks the workspace in dependency order and rewrites every `workspace:^`
      # range into the concrete published version.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
